name: Build NASKULL AI Photo APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: NASKULL_AI_Photo
        run: gradle assembleDebug
      - name: Rename APK
        run: cp NASKULL_AI_Photo/app/build/outputs/apk/debug/app-debug.apk NASKULL-AI-Photo.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NASKULL-AI-Photo-apk
          path: NASKULL-AI-Photo.apk
          if-no-files-found: error
      # Publica el APK en "Releases" para poder descargarlo directamente desde el móvil.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NASKULL AI Photo (build ${{ github.run_number }})
          files: NASKULL-AI-Photo.apk
